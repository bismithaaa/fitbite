<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Dietitian - FitBite Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Copy minimal styles from admin_dietitians.html for consistency */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --FitBite-green: #00b140; --sidebar-width: 260px; --header-height: 70px; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f9; }
        .app-header { position: fixed; top: 0; left: var(--sidebar-width); right: 0; height: var(--header-height); background: linear-gradient(135deg, #1a1a1a, #2d2d2d); color: white; display: flex; align-items: center; padding: 0 30px; }
        .logo-src { background: url('https://cdn.logojoy.com/wp-content/uploads/20230621140452/FitBite-logo.png') no-repeat center; background-size: contain; width: 120px; height: 40px; filter: brightness(0) invert(1); }
        .app-sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: #2c3e50; color: white; }
        .sidebar-header { padding: 20px; }
        .seller-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--FitBite-green); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .main-content { margin-left: var(--sidebar-width); margin-top: var(--header-height); padding: 30px; min-height: calc(100vh - var(--header-height)); }
        .delete-card { background: white; border-radius: 15px; padding: 40px; text-align: center; max-width: 500px; margin: 50px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .delete-icon { font-size: 64px; color: #e74c3c; margin-bottom: 20px; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 12px 30px; border-radius: 8px; margin: 10px; }
        .btn-secondary { background: #95a5a6; color: white; border: none; padding: 12px 30px; border-radius: 8px; margin: 10px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="delete-card">
            <div class="delete-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>Delete Dietitian</h3>
            <p>Are you sure you want to delete <strong>{{ dietitian.name }}</strong>?</p>
            <p>This action cannot be undone.</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
                <a href="{% url 'admin_dietitians' %}" class="btn-secondary"><i class="fas fa-times"></i> Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
